[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matbench-gnn-service"
version = "0.1.0"
description = "Predicting elastic moduli from crystal structure: Matbench baselines, a GNN, and a served API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy==1.22.4",
    "scipy==1.7.3",
    "pandas==2.3.3",
    "scikit-learn==1.0.1",
    "matplotlib==3.8.4",
    "pymatgen==2023.9.25",
    "matminer==0.7.4",
    "matbench==0.6",
    "spglib==2.1.0",
]

[project.optional-dependencies]
gnn = ["torch", "torch-geometric"]
serve = ["fastapi", "uvicorn[standard]", "python-multipart"]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
